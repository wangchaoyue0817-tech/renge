&lt;script&gt;
(() =&gt; {
  const root = document.getElementById('premium-insight-preview');
  if (!root) return;
  const insights = [
    { code: 'S', trait: '惜时型', description: '珍视时间与秩序，以规划和自律获得确定感。', category: '包袋', icon: 'shopping-bag' },
    { code: 'A', trait: '进取型', description: '由目标和成长驱动，愿意持续投入并追求卓越。', category: '美妆', icon: 'sparkles' },
    { code: 'M', trait: '联结型', description: '关注情感共鸣与关系连接，从陪伴中获得力量。', category: '鞋靴', icon: 'footprints' },
    { code: 'T', trait: '开放型', description: '善意向外流动，愿意信任、支持并连接更广的人。', category: '服饰', icon: 'shirt' }
  ];
  const categories = [
    ['包袋','shopping-bag','箱包材质与工艺'], ['服装','shirt','版型面料与细节'],
    ['美妆','sparkles','成分与品质鉴别'], ['鞋靴','footprints','鞋型材质与做工'],
    ['餐品','utensils','食材包装与溯源'], ['人格','scan-face','发现你的性格图谱'],
    ['藏币','circle-dollar-sign','钱币版别与真伪'], ['瓷器','flask-conical','胎釉款识与年代'],
    ['腕表','watch','机芯外观与细节'], ['酒水','wine','瓶标包装与批次'],
    ['玉石','gem','种水色泽与结构']
  ];
  const layer = root.querySelector('#premium-sheet-layer');
  const grid = root.querySelector('#premium-category-grid');
  const socialBody = root.querySelector('#premium-social-body');
  const hotStrip = root.querySelector('#premium-hot-strip');
  const dots = [...root.querySelectorAll('.premium-dots i')];
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let insightIndex = 0;
  let toastTimer;

  categories.forEach(([name, icon, description]) =&gt; {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'premium-category';
    button.innerHTML = `&lt;span&gt;&lt;i data-lucide=&quot;${icon}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;span&gt;&lt;strong&gt;${name}&lt;/strong&gt;&lt;small&gt;${description}&lt;/small&gt;&lt;/span&gt;`;
    button.addEventListener('click', () =&gt; {
      closeSheet();
      showToast(`已进入${name}鉴定预览`);
    });
    grid.appendChild(button);
  });
  if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });

  function openSheet() { layer.classList.add('visible'); layer.setAttribute('aria-hidden','false'); }
  function closeSheet() { layer.classList.remove('visible'); layer.setAttribute('aria-hidden','true'); }
  function showToast(message) {
    const toast = root.querySelector('#premium-toast');
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() =&gt; toast.classList.remove('show'), 1700);
  }
  function countTo(element, target, suffix) {
    if (reduced) { element.textContent = `${target}${suffix}`; return; }
    const from = Number.parseInt(element.textContent, 10) || 0;
    const started = performance.now();
    const tick = now =&gt; {
      const progress = Math.min((now - started) / 820, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      element.textContent = `${Math.round(from + (target - from) * eased)}${suffix}`;
      if (progress &lt; 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
  function updateInsight(index, first = false) {
    const item = insights[index];
    const swap = () =&gt; {
      root.querySelector('#premium-category').textContent = item.category;
      root.querySelector('#premium-trait').textContent = `【${item.trait}】`;
      root.querySelector('#premium-trait-desc').textContent = item.description;
      root.querySelector('#premium-dimension-title').textContent = `同特质热门 · ${item.category}`;
      root.querySelector('#premium-go-label').textContent = `去鉴${item.category}`;
      root.querySelector('#premium-go').dataset.category = item.category;
      root.querySelector('#premium-hot-icon').innerHTML = `&lt;i data-lucide=&quot;${item.icon}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;`;
      if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
      dots.forEach((dot, dotIndex) =&gt; dot.classList.toggle('active', dotIndex === index));
      socialBody.classList.remove('changing');
      hotStrip.classList.remove('changing');
      countTo(root.querySelector('#premium-people'), 680 + Math.floor(Math.random() * 1220), '');
      countTo(root.querySelector('#premium-percent'), 42 + Math.floor(Math.random() * 45), '%');
    };
    if (first || reduced) swap(); else { socialBody.classList.add('changing'); hotStrip.classList.add('changing'); setTimeout(swap, 230); }
  }

  root.querySelector('#premium-benefit').addEventListener('click', openSheet);
  root.querySelector('#premium-open-sheet').addEventListener('click', event =&gt; { event.stopPropagation(); openSheet(); });
  root.querySelector('#premium-mask').addEventListener('click', closeSheet);
  root.querySelector('#premium-close').addEventListener('click', closeSheet);
  root.querySelector('#premium-go').addEventListener('click', event =&gt; showToast(`已进入${event.currentTarget.dataset.category || '包袋'}鉴定预览`));
  updateInsight(0, true);
  setInterval(() =&gt; { insightIndex = (insightIndex + 1) % insights.length; updateInsight(insightIndex); }, 5200);
})();
&lt;/script&gt;

<script>(() => {

  if (!(frame instanceof HTMLIFrameElement)) {

    const data = event.data;

        typeof height === "number" &&
        Number.isFinite(height) &&
